# Supabase local development config.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "graph-editor"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Every large read is paged in bounded chunks (lib/data/graphs.ts fetchAllRows
# uses .range() in PAGE-sized windows and concatenates), so nothing relies on a
# single request returning a whole big graph. Keep the cap at the page size —
# it doubles as a guard against unbounded pulls.
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

# Email testing server — emails sent locally are captured here, not delivered.
[local_smtp]
enabled = true
port = 54334

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev: sign in immediately after sign-up. Production (hosted Supabase)
# keeps confirmations on — the /auth/callback route handles the confirm link.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Local-dev GitHub sign-in. Set both env vars before `supabase start`
# (create an OAuth app with callback http://127.0.0.1:54331/auth/v1/callback).
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"

# Local-dev Google sign-in. skip_nonce_check is required for local Google auth.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
